<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7eee4"/>
      <stop offset="1" stop-color="#dfc5b2"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".16"/></filter>
    <style>
      .noir{font:700 104px Georgia,serif;letter-spacing:18px;fill:#332a25}
      .sub{font:500 25px Arial,sans-serif;letter-spacing:9px;fill:#75675e}
      .small{font:600 18px Arial,sans-serif;letter-spacing:5px;fill:#c95f3d}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  
  
  <path d="M80 150 H1200" stroke="#332a25" opacity=".13">
    <animate attributeName="x1" values="80;180;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1200;1100;1200" dur="4s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#shadow)">
    <rect x="230" y="210" width="820" height="300" rx="28" fill="#fbf6f0" opacity=".86"/>
  </g>
  <text x="640" y="335" text-anchor="middle" class="small">FRIZERIE • COAFURĂ</text>
  <text x="640" y="445" text-anchor="middle" class="noir">
    NOIR
    <animateTransform attributeName="transform" type="translate" values="0 12;0 -12;0 12" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="640" y="482" text-anchor="middle" class="sub">STUDIO</text>
  <path d="M470 535 H810" stroke="#c95f3d" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x1" values="520;470;520" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="760;810;760" dur="2.8s" repeatCount="indefinite"/>
  </path>
  <text x="640" y="610" text-anchor="middle" class="small" opacity=".9">STYLE • DETAIL • CONFIDENCE</text>
</svg>